<!DOCTYPE html>
<html>
<head>
    <title>Attributes Demo</title>
</head>

<body>

    <h2>HTML Attributes Demo</h2>

    <p>
        <input type="email" required>
    </p>

    <p>
        <input type="submit" value="Submit" id="error" enabled>
    </p>

    <p>
        <input type="text" value="Read Only Text" readonly>
    </p>

    <p>
        <input type="checkbox" checked>
    </p>

</body>
</html>
