<!DOCTYPE html>
<html>
<head>
    <title>Internal CSS</title>

    <style>
        body {
            background-color: lightgray;
        }

        .box {
            width: 400px;
            height: 300px;
            background-color: red;
            border: 3px solid black;
            padding: 20px;
            margin: 30px auto;
            border-radius: 10px;
        }

        button {
            width: 120px;
            height: 40px;
            background-color: blue;
            color: white;
            border: 2px solid darkblue;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Internal CSS</h1>

        <p>This is a basic Internal CSS design.</p>

        <button onclick="alert('Button Clicked!')">
            Click Me
        </button>

    </div>

</body>
</html>
