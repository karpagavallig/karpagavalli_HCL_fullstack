<html>
   <head>
       <title>Event Handlers Example</title>
       <base href = "https://www.google.com/" />
       <script type = "text/JavaScript">
         function Handler() {
              alert(" mouse hover");
         }
       </script>
    </head>
    <body>
        <p onmouseover = "Handler();">Map the mouse here...</p>
    </body>
</html>
